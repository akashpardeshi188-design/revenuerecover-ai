name: Staging auth integration checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://staging-build.example.invalid
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      CRON_SECRET: ci-only-not-a-real-secret
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      RAZORPAY_WEBHOOK_SECRET: ci-only-not-a-real-secret
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
